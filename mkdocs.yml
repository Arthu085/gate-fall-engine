site_name: GateFall
site_description: >-
  Fusão adaptativa por confiança entre pose e informação visual de modelos de
  fundação para detecção robusta de quedas humanas
site_author: Arthur Ghizi
repo_url: https://github.com/Arthu085/gate-fall-engine
repo_name: Arthu085/gate-fall-engine

docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura:
      - Visão geral: architecture/overview.md
      - Tecnologias: architecture/technology-stack.md
  - Execução:
      - Pipelines experimentais: runbooks/pipelines.md
  - Dados:
      - Organização: data/organization.md
      - OmniFall: data/omnifall.md
      - Le2i: data/le2i.md
      - Manifesto e verificação: data/manifest-verification.md
      - Contrato temporal: data/temporal-contract.md
      - Padronização de features de pose: data/pose-standardization.md
      - Índice de qualidade de pose: data/pose-quality.md
      - Auditoria de caixas manuais Le2i: data/le2i-manual-bbox-audit.md
      - Features DINOv3: data/dinov3-features.md
      - Índice de qualidade visual DINOv3: data/dinov3-quality.md
      - Padronização de features DINOv3: data/dinov3-standardization.md
      - Features de qualidade (q_pose, q_visual): data/quality-features.md
      - Fundação SAM 3 (braço C): data/sam3-foundation.md
      - Índice de qualidade SAM 3: data/sam3-quality.md
      - Padronização do descritor SAM 3: data/sam3-standardization.md
  - Treino:
      - Braço A (TCN): train/baseline-a.md
      - Braço B0 (fusão pose + DINOv3): train/baseline-b0.md
      - Braço B1 (fusão adaptativa por gate): train/baseline-b1.md
      - Braço C0 (fusão pose + SAM 3): train/baseline-c0.md
      - Braço C1 (gate adaptativo com SAM 3): train/baseline-c1.md
      - Dobras internas do Le2i-CV (Etapa 2C): train/internal-folds.md
      - Dobras por sujeito do Le2i-CS (Etapa 4B): train/subject-folds.md
      - Perda simulada de detecção nas dobras por sujeito (Etapa 4C): train/subject-fold-detection-dropout.md
      - Amostragem balanceada por sujeito nas dobras por sujeito (Etapa 5A): train/subject-fold-subject-balanced-sampling.md
      - Investigação de determinismo de GPU: train/gpu-determinism.md
  - Avaliação por eventos:
      - Braço A (protocolo de alarme): eval/baseline-a-events.md
      - Braço B0 (protocolo de alarme): eval/baseline-b0-events.md
      - Braço B1 (protocolo de alarme): eval/baseline-b1-events.md
      - Braço C0 (protocolo de alarme): eval/baseline-c0-events.md
      - Braço C1 (protocolo de alarme): eval/baseline-c1-events.md
  - Análises:
      - Degradação do gate B1/C1: analysis/gate-degradation.md
      - Generalização entre ambientes (Le2i-CV): analysis/le2i-cv-generalization.md
      - Diagnóstico qualitativo (render): analysis/qualitative-render.md
      - Sensibilidade do protocolo de alarme: analysis/alarm-protocol-sensitivity.md
      - Bootstrap agrupado por sujeito (IC): analysis/grouped-bootstrap.md
      - Sumário multi-seed: analysis/multiseed-summary.md
      - Diagnóstico de erros de classificação: analysis/classification-diagnosis.md
      - Diagnóstico estratificado de erros: analysis/stratified-error-diagnosis.md
      - Consolidação multi-seed dos erros: analysis/multiseed-error-consolidation.md
      - Decisão sobre intervenções (Etapas 2A, 2G, 4A–4D e 5A): analysis/intervention-decision.md
      - Viabilidade das dobras internas do Le2i-CV (Etapa 2B): analysis/internal-fold-feasibility.md
      - Piloto das dobras internas do Le2i-CV (Etapa 2D): analysis/internal-fold-pilot.md
      - Auditoria dos ambientes retidos (Etapa 2E): analysis/internal-fold-retained-audit.md
      - Contrafactual de neutralização visual (Etapa 2F): analysis/visual-neutralization-counterfactual.md
      - Rascunho do manuscrito (Resultados e Discussão): analysis/manuscript-results-discussion.md
      - Síntese diagnóstica entre braços: analysis/cross-arm-diagnostic-synthesis.md
      - Contexto de janela dos erros other→walk (Etapa 3A): analysis/window-context-diagnosis.md
      - Conjunto de revisão dos erros other→walk (Etapa 3B): analysis/other-walk-review-set.md
      - Composição de other e walk no treino (Etapa 3C): analysis/other-walk-train-composition.md
      - Viabilidade das dobras por sujeito do Le2i-CS (Etapa 4A): analysis/subject-fold-feasibility.md
      - Robustez de inferência à perda de detecção (Etapa 4D): analysis/subject-fold-dropout-robustness.md
      - Erros standing→walk e sitting→stand_up (Etapa 6A): analysis/standing-sitting-diagnosis.md
  - Referência:
      - Referência de comandos: reference/commands.md
      - Referências finais do Le2i: reference/le2i-runs.md
