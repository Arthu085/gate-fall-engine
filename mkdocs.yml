site_name: GateFall
site_description: >-
  Fusão adaptativa por confiança entre pose e informação visual de modelos de
  fundação para detecção robusta de quedas humanas
site_author: Arthur Ghizi
repo_url: https://github.com/Arthu085/gate-fall-engine
repo_name: Arthu085/gate-fall-engine

docs_dir: docs

theme:
  name: material
  language: pt-BR
  features:
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Arquitetura:
      - Visão geral: architecture/overview.md
      - Tecnologias: architecture/technology-stack.md
  - Execução:
      - Pipeline do braço A: runbooks/pipeline-a.md
      - Referência de comandos: reference/commands.md
  - Dados:
      - Organização: data/organization.md
      - OmniFall: data/omnifall.md
      - Le2i: data/le2i.md
      - Manifesto e verificação: data/manifest-verification.md
      - Contrato temporal: data/temporal-contract.md
      - Padronização de features de pose: data/pose-standardization.md
      - Índice de qualidade de pose: data/pose-quality.md
      - Features DINOv3: data/dinov3-features.md
      - Padronização de features DINOv3: data/dinov3-standardization.md
  - Treino:
      - Braço A (TCN): train/baseline-a.md
      - Arma B0 (fusão pose + DINOv3): train/b0-fusion.md
      - Investigação de determinismo de GPU: train/gpu-determinism.md
  - Avaliação:
      - Braço A (protocolo de alarme): eval/baseline-a-events.md
      - Generalização entre ambientes (Le2i-CV): eval/le2i-cv-generalization.md
      - Diagnóstico qualitativo (render): eval/qualitative-render.md
      - Sensibilidade do protocolo de alarme: eval/alarm-protocol-sensitivity.md
      - Bootstrap agrupado por sujeito (IC): eval/grouped-bootstrap.md
      - Sumário multi-seed: eval/multiseed-summary.md
