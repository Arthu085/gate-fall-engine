name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Instalar dependências
        run: uv sync --locked --dev
      - name: Rodar selftests sintéticos
        run: |
          uv run python -m gatefall.data.timegrid selftest
          uv run python -m gatefall.data.windows selftest
          uv run python -m gatefall.data.frames_io selftest
          uv run python -m gatefall.pose.loading selftest
          uv run python -m gatefall.pose.kinematics selftest
          uv run python -m gatefall.data.pose_dataset selftest
          uv run python -m gatefall.features.standardize selftest
          uv run python -m gatefall.train.baseline_a selftest
          uv run python -m gatefall.eval.baseline_a_events selftest
          uv run python -m gatefall.pipeline selftest
          uv run python -m gatefall.runs_selftest
      - name: Verificar tipos
        run: uv run pyright
      - name: Construir documentação
        run: uv run mkdocs build --strict
