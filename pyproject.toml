[project]
name = "gatefall"
version = "0.1.0"
description = "Fusão adaptativa por confiança entre pose e informação visual de modelos de fundação para detecção robusta de quedas humanas"
readme = "README.md"
authors = [
    { name = "Arthur Ghizi", email = "arthurghizi22@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "datasets>=5.0.1",
    "h5py>=3.16.0",
    "huggingface-hub>=1.28.0",
    "lap>=0.5.13",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "ultralytics>=8.4.131",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "pyright>=1.1.400",
]

[tool.pyright]
include = ["src", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
